name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Determine changed Python files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only -z "origin/${{ github.base_ref }}...HEAD" -- '*.py' > .changed-python-files
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only -z -r HEAD -- '*.py' > .changed-python-files
            else
              git diff --name-only -z "$before" "${{ github.sha }}" -- '*.py' > .changed-python-files || \
                git diff-tree --no-commit-id --name-only -z -r HEAD -- '*.py' > .changed-python-files
            fi
          fi

      - name: Compile Python sources
        run: python -m compileall -q gpc scripts tests

      - name: Ruff critical checks
        run: python -m ruff check --select E9,F63,F7,F82 gpc scripts tests

      - name: Ruff changed files
        run: |
          if [ -s .changed-python-files ]; then
            xargs -0 -r python -m ruff check < .changed-python-files
          else
            echo "No changed Python files."
          fi

      - name: Black changed files
        run: |
          if [ -s .changed-python-files ]; then
            xargs -0 -r python -m black --check < .changed-python-files
          else
            echo "No changed Python files."
          fi
